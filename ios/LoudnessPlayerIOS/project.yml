name: LoudnessPlayerIOS

options:
  bundleIdPrefix: com.wzl.loudnessplayer.ios
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.4"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  FFmpegAudioBridge:
    type: framework.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Vendor/FFmpegAudioBridge
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzl.loudnessplayer.ios.ffmpegbridge
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
    dependencies:
      - framework: Vendor/Artifacts/FFmpegAudio.xcframework

  LoudnessPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzl.loudnessplayer.ios
        PRODUCT_NAME: LoudnessPlayer
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: FFmpegAudioBridge
        embed: false
      - target: LoudnessPlayerWidget
        embed: true

  LoudnessPlayerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzl.loudnessplayer.ios.widget
        PRODUCT_NAME: LoudnessPlayerWidget
        INFOPLIST_FILE: Config/Widget-Info.plist
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO

  LoudnessPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
      - path: Fixtures/Runtime
        type: group
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzl.loudnessplayer.ios.tests
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: LoudnessPlayer

schemes:
  LoudnessPlayer:
    build:
      targets:
        LoudnessPlayer: all
        LoudnessPlayerWidget: all
    test:
      gatherCoverageData: true
      targets:
        - LoudnessPlayerTests
    run:
      config: Debug
    archive:
      config: Release
