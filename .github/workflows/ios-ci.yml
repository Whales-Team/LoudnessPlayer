name: iOS CI

on:
  push:
    branches: [main, agent/ios-player]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - "docs/IOS.md"
      - "README.md"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - "docs/IOS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Tests and unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen 2.46.0
        working-directory: ios/LoudnessPlayerIOS
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen" >> "$GITHUB_PATH"
          /tmp/xcodegen/xcodegen --version | grep '2.46.0'

      - name: Run tests and build
        working-directory: ios/LoudnessPlayerIOS
        run: |
          chmod +x Scripts/ci-build.sh
          Scripts/ci-build.sh

      - name: Upload logs and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoudnessPlayer-iOS-1.0.0-simulator
          retention-days: 14
          if-no-files-found: warn
          path: |
            ios/LoudnessPlayerIOS/build/*.log
            ios/LoudnessPlayerIOS/build/DerivedData/Build/Products/Release-iphonesimulator/LoudnessPlayer.app
