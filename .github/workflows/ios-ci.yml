name: iOS CI

on:
  push:
    branches: [main, agent/ios-player]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - "docs/IOS.md"
      - "README.md"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - "docs/IOS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Tests and unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen 2.46.0
        working-directory: ios/LoudnessPlayerIOS
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          /tmp/xcodegen/xcodegen/bin/xcodegen --version | grep '2.46.0'

      - name: Install matching iOS simulator runtime
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          raise SystemExit(0 if any(item.get("isAvailable") for item in data["runtimes"] if item["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) else 1)
          '; then
            xcodebuild -downloadPlatform iOS
          fi

          runtime_id="$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          items = [item for item in json.load(sys.stdin)["runtimes"] if item.get("isAvailable") and item["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          print(items[-1]["identifier"])
          ')"
          device_type="$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          items = json.load(sys.stdin)["devicetypes"]
          preferred = next((item for item in items if item["name"] == "iPhone 16 Pro"), None)
          print((preferred or next(item for item in reversed(items) if item["name"].startswith("iPhone")))["identifier"])
          ')"
          xcrun simctl create "LoudnessPlayer CI" "$device_type" "$runtime_id"
          xcrun simctl list devices available

      - name: Restore slim FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ios/LoudnessPlayerIOS/Vendor/Artifacts
          key: ffmpeg-ios-n8.0.3-${{ hashFiles('ios/LoudnessPlayerIOS/Scripts/build-ffmpeg-xcframework.sh') }}

      - name: Build slim LGPL FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: ios/LoudnessPlayerIOS
        run: |
          chmod +x Scripts/build-ffmpeg-xcframework.sh
          Scripts/build-ffmpeg-xcframework.sh

      - name: Verify FFmpeg slices and license flags
        working-directory: ios/LoudnessPlayerIOS
        run: |
          chmod +x Scripts/verify-ffmpeg.sh
          Scripts/verify-ffmpeg.sh

      - name: Download FFmpeg conformance fixtures
        working-directory: ios/LoudnessPlayerIOS
        run: |
          chmod +x Scripts/download-codec-fixtures.sh
          Scripts/download-codec-fixtures.sh

      - name: Run tests and build
        working-directory: ios/LoudnessPlayerIOS
        run: |
          chmod +x Scripts/ci-build.sh
          Scripts/ci-build.sh

      - name: Upload logs and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoudnessPlayer-iOS-1.0.0-simulator
          retention-days: 14
          if-no-files-found: warn
          path: |
            ios/LoudnessPlayerIOS/build/*.log
            ios/LoudnessPlayerIOS/build/DerivedData/Build/Products/Release-iphonesimulator/LoudnessPlayer.app
